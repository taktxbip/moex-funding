name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh funding data every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-data.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub has no list-deployments route (that call 404s).
          # A deployment can be addressed by the commit SHA that created it.
          cancelled=0
          shas=$(gh api "repos/${GITHUB_REPOSITORY}/commits?per_page=20" --jq '.[].sha' || true)
          for sha in $shas; do
            if [ "$sha" = "${GITHUB_SHA}" ]; then
              continue
            fi
            status=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}" --jq '.status' 2>/dev/null || true)
            case "$status" in
              deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn|deployment_attempt_error)
                echo "Cancelling Pages deployment $sha ($status)"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" || true
                cancelled=1
                ;;
            esac
          done
          if [ "$cancelled" -eq 1 ]; then
            sleep 15
          else
            echo "No in-progress Pages deployments"
          fi
      - id: deployment
        uses: actions/deploy-pages@v5
