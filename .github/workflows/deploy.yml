name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh funding data every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-data.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments" \
            --jq '.[] | select(.status != "succeed" and .status != "deployment_failed" and .status != "deployment_content_failed" and .status != "deployment_cancelled" and .status != "deployment_lost") | .id')
          if [ -z "$ids" ]; then
            echo "No in-progress Pages deployments"
            exit 0
          fi
          for id in $ids; do
            echo "Cancelling Pages deployment $id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${id}/cancel"
          done
          sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
